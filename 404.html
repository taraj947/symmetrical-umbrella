<!DOCTYPE html>
<html>

<head>
  <meta
    http-equiv="Content-Security-Policy"
    content="script-src 'nonce-aem' 'strict-dynamic' 'unsafe-inline' http: https:; base-uri 'self'; object-src 'none';"
    move-to-http-header="true"
  >
  <title>Page not found</title>
  <script nonce="aem" type="text/javascript">
    window.isErrorPage = true;
    window.errorCode = '404';
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta property="og:title" content="Page not found">
  <script nonce="aem" src="/scripts/scripts.js" type="module"></script>
  <script nonce="aem" type="module">
    window.addEventListener('load', () => {
      if (document.referrer) {
        const { origin, pathname } = new URL(document.referrer);
        if (origin === window.location.origin) {
          const backBtn = document.createElement('a');
          backBtn.classList.add('button', 'error-button-back');
          backBtn.href = pathname;
          backBtn.textContent = 'Go back';
          backBtn.title = 'Go back';
          const btnContainer = document.querySelector('.button-container');
          btnContainer.append(backBtn);
        }
      }
    });
  </script>
  <script nonce="aem" type="module">
    import { sampleRUM } from '/scripts/aem.js';
    sampleRUM('404', { source: document.referrer });
  </script>
  <link rel="stylesheet" href="/styles/styles.css">
  <style>
    main.error {
      min-height: calc(100vh - var(--nav-height));
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 24px;
      box-sizing: border-box;
      background:
        radial-gradient(circle at top left, rgba(255,255,255,0.2), transparent 30%),
        linear-gradient(135deg, #1b1b1b 0%, #2d2d2d 100%);
    }

    main.error .section {
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      gap: 32px;
      align-items: center;
      width: min(1100px, 100%);
      margin: 0;
      padding: 40px;
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 28px;
      background: rgba(17, 17, 17, 0.65);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
    }

    .error-content {
      color: #f5f5f5;
    }

    .error-kicker {
      margin: 0 0 16px;
      color: #d9d9d9;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .error-message {
      margin: 0;
      font-size: clamp(2.5rem, 5vw, 5rem);
      line-height: 0.95;
      letter-spacing: -0.06em;
    }

    .error-description {
      max-width: 36rem;
      margin: 20px 0 28px;
      color: #d5d5d5;
      font-size: 1.125rem;
    }

    .button-container {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin: 0;
    }

    .button-container .button {
      min-width: 160px;
    }

    .error-visual {
      position: relative;
      display: grid;
      place-items: center;
      min-height: 260px;
    }

    .error-number {
      width: min(320px, 100%);
      filter: drop-shadow(0 18px 34px rgba(0, 0, 0, 0.25));
    }

    .error-number text {
      fill: #f7f7f7;
      font-family: monospace;
      font-weight: 700;
      letter-spacing: -0.08em;
    }

    .error-orbit {
      position: absolute;
      inset: auto 10% 10% auto;
      width: 180px;
      height: 180px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 50%;
      transform: rotate(28deg);
    }

    .error-orbit::before,
    .error-orbit::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
    }

    .error-orbit::before {
      inset: 22px;
      border: 1px solid rgba(255, 255, 255, 0.14);
    }

    .error-orbit::after {
      width: 18px;
      height: 18px;
      top: 12px;
      right: 26px;
      background: #d9d9d9;
      box-shadow: 0 0 0 8px rgba(255, 255, 255, 0.08);
    }

    @media (width <= 800px) {
      main.error .section {
        grid-template-columns: 1fr;
        padding: 28px 20px;
      }

      .error-visual {
        min-height: 180px;
      }
    }
  </style>
  <link rel="stylesheet" href="/styles/lazy-styles.css">
</head>

<body>
  <header></header>
  <main class="error">
    <div class="section">
      <div class="error-content">
        <p class="error-kicker">404 error</p>
        <h1 class="error-message">Page not found</h1>
        <p class="error-description">The page you were looking for may have moved, been removed, or never existed. Let's get you back on track.</p>
        <p class="button-container">
          <a href="/" class="button primary error-button-home">Go home</a>
        </p>
      </div>
      <div class="error-visual" aria-hidden="true">
        <svg viewBox="0 0 38 18" class="error-number">
          <text x="0" y="17">404</text>
        </svg>
        <div class="error-orbit"></div>
      </div>
    </div>
  </main>
  <footer></footer>
</body>

</html>
